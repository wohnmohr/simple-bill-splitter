<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>SplitBiller YouTube banner</title>
<!--
  YouTube channel art: 2560x1440. TV shows all of it, desktop a 2560x423
  band through the middle, phones only the centre 1546x423 (the safe area).
  Render: node render.mjs (writes splitbiller-youtube-banner.png).
-->
<style>
	@font-face { font-family: "Fraunces"; font-weight: 600; src: url("../whats-new/composition/assets/fonts/fraunces-latin-600-normal.woff2") format("woff2"); }
	@font-face { font-family: "Outfit"; font-weight: 500; src: url("../whats-new/composition/assets/fonts/outfit-latin-500-normal.woff2") format("woff2"); }
	@font-face { font-family: "Outfit"; font-weight: 600; src: url("../whats-new/composition/assets/fonts/outfit-latin-600-normal.woff2") format("woff2"); }
	@font-face { font-family: "Outfit"; font-weight: 700; src: url("../whats-new/composition/assets/fonts/outfit-latin-700-normal.woff2") format("woff2"); }

	:root {
		--paper: #f7f6f3; --surface: #ffffff; --ink: #1c1826; --ink-soft: #4a4556; --ink-muted: #6b6576;
		--line: #e7e3ea; --brand: #53307b; --brand-600: #663a96; --brand-50: #f6f2fa; --brand-100: #ece3f5;
		--positive: #11754c; --positive-soft: #e8f4ee; --negative: #b42318;
	}
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 2560px; height: 1440px; overflow: hidden; }
	body {
		position: relative; background: var(--paper); color: var(--ink); font-family: "Outfit", sans-serif;
		-webkit-font-smoothing: antialiased;
	}

	/* Soft brand light, like the promo video. */
	.glow { position: absolute; border-radius: 50%; filter: blur(40px); }
	.g1 { width: 1400px; height: 1000px; left: -260px; top: 220px; background: radial-gradient(closest-side, rgba(189,159,219,.38), rgba(189,159,219,0)); }
	.g2 { width: 1500px; height: 1100px; right: -300px; top: 180px; background: radial-gradient(closest-side, rgba(236,227,245,.95), rgba(236,227,245,0)); }
	.g3 { width: 1200px; height: 700px; left: 680px; top: 380px; background: radial-gradient(closest-side, rgba(255,255,255,.9), rgba(255,255,255,0)); }
	/* A faint dot grid for texture on TV, fading out at the edges. */
	.dots {
		position: absolute; inset: 0;
		background-image: radial-gradient(rgba(83,48,123,.10) 1.6px, transparent 1.6px);
		background-size: 34px 34px;
		mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 32%, #000 75%);
	}

	/* ---- Safe area: 1546x423, centred. Everything that matters lives here. */
	.safe {
		position: absolute; left: 507px; top: 508px; width: 1546px; height: 423px;
		display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
	}
	.brand { display: flex; align-items: center; gap: 22px; }
	.brand img { height: 86px; }
	.brand span { font-family: "Fraunces"; font-weight: 600; font-size: 64px; letter-spacing: -0.5px; }
	h1 {
		margin-top: 22px; font-family: "Fraunces"; font-weight: 600; font-size: 132px; line-height: 1;
		letter-spacing: -2.5px;
	}
	h1 .u { position: relative; color: var(--brand); white-space: nowrap; }
	h1 .u::after {
		content: ""; position: absolute; left: 4px; right: 10px; bottom: -14px; height: 12px; border-radius: 12px;
		background: var(--brand);
	}
	.promise { margin-top: 44px; display: flex; gap: 14px; justify-content: center; }
	.chip {
		display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px 12px 18px; border-radius: 999px;
		background: var(--surface); border: 2px solid var(--line); font-size: 30px; font-weight: 600; color: var(--ink-soft);
		box-shadow: 0 2px 8px rgba(28,24,38,.04);
	}
	.chip svg { width: 26px; height: 26px; color: var(--positive); }

	/* ---- App cards in the desktop band, either side of the safe area. */
	.card {
		position: absolute; width: 420px; background: var(--surface); border: 2px solid var(--line); border-radius: 30px;
		padding: 28px 30px; box-shadow: 0 30px 60px -20px rgba(43,26,64,.28), 0 8px 18px rgba(43,26,64,.06);
	}
	.left { left: 58px; top: 538px; transform: rotate(-4deg); padding-top: 24px; padding-bottom: 14px; }
	.right { left: 2084px; top: 548px; transform: rotate(4deg); }
	.trip { margin-top: 6px; font-family: "Fraunces"; font-weight: 600; font-size: 40px; }
	.badge {
		display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 5px 14px; border-radius: 999px;
		background: var(--positive-soft); color: var(--positive); font-size: 18px; font-weight: 600;
	}
	.badge svg { width: 17px; height: 17px; }
	.total { margin-top: 12px; font-size: 22px; color: var(--ink-muted); }
	.total b { font-size: 34px; color: var(--ink); font-weight: 700; margin-right: 6px; }
	.rows { margin-top: 12px; border-top: 2px solid var(--line); }
	.row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 2px solid var(--line); font-size: 24px; font-weight: 600; }
	.row:last-child { border-bottom: 0; }
	.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; font-weight: 700; }
	.row .amt { margin-left: auto; font-variant-numeric: tabular-nums; }
	.pos { color: var(--positive); } .neg { color: var(--negative); }

	.settle-title { font-size: 21px; font-weight: 600; color: var(--ink-muted); }
	.pair { margin-top: 14px; display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 600; }
	.pair svg { width: 26px; height: 26px; color: var(--ink-muted); }
	.big { margin-top: 10px; font-family: "Fraunces"; font-weight: 600; font-size: 64px; letter-spacing: -1px; }
	.pay {
		margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; height: 68px; border-radius: 18px;
		background: var(--brand); color: #fff; font-size: 26px; font-weight: 700;
	}
	.done { margin-top: 16px; display: flex; align-items: center; gap: 10px; font-size: 21px; color: var(--positive); font-weight: 600; }
	.done svg { width: 22px; height: 22px; }

	/* Debug overlay for checking crops: add ?guides to the URL. */
	.guide { position: absolute; border: 4px dashed rgba(180,35,24,.7); pointer-events: none; display: none; }
	body.guides .guide { display: block; }
</style>
</head>
<body>
	<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
	<div class="dots"></div>

	<!-- Left: a group's balances -->
	<div class="card left">
		<div class="trip">Goa trip</div>
		<div class="badge">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
			End-to-end encrypted
		</div>
		<div class="total"><b>₹38,460</b>11 expenses</div>
		<div class="rows">
			<div class="row"><span class="av" style="background:hsl(275 70% 55% / .18);color:#53307b">P</span>Priya<span class="amt pos">+₹9,155</span></div>
			<div class="row"><span class="av" style="background:hsl(160 60% 45% / .18);color:#11754c">A</span>Aisha<span class="amt neg">−₹2,940</span></div>
			<div class="row"><span class="av" style="background:hsl(25 85% 55% / .2);color:#9a4a10">R</span>Rohan<span class="amt neg">−₹6,215</span></div>
		</div>
	</div>

	<!-- Right: settle up by UPI -->
	<div class="card right">
		<div class="settle-title">2 payments settle it</div>
		<div class="pair">
			Rohan
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
			Priya
		</div>
		<div class="big">₹6,215</div>
		<div class="pay">₹ Pay ₹6,215 with UPI</div>
		<div class="done">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
			Aisha paid ₹2,940
		</div>
	</div>

	<!-- Safe area -->
	<div class="safe">
		<div class="brand"><img src="logo-mark.png" alt="" /><span>SplitBiller</span></div>
		<h1>Split bills, <span class="u">privately.</span></h1>
		<div class="promise">
			<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Settle by UPI</span>
			<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>No signup</span>
			<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>End-to-end encrypted</span>
			<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>splitbiller.com</span>
		</div>
	</div>

	<div class="guide" style="left:507px;top:508px;width:1546px;height:423px"></div>
	<div class="guide" style="left:0;top:508px;width:2560px;height:423px;border-color:rgba(17,117,76,.7)"></div>
	<script>if (location.search.includes("guides")) document.body.classList.add("guides");</script>
</body>
</html>

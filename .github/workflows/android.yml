name: Android app

# Builds the Play app whenever it changes, so a broken build never reaches a release.
# The debug APK is kept for a week to try the widget on a phone.
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [staging, production]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build the app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Also checks gradle-wrapper.jar is Gradle's own.
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: splitbiller-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
